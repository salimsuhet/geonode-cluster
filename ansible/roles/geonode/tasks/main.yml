---
# roles/geonode/tasks/main.yml

- name: Cria diretórios GeoNode
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: '0755'
  loop:
    - /opt/geonode
    - /opt/geonode/static
    - /opt/geonode/media
    - /opt/geonode/backup
  tags: [geonode]

- name: Copia docker-compose do GeoNode
  template:
    src: docker-compose.geonode.yml.j2
    dest: /opt/geonode/docker-compose.yml
    mode: '0644'
  notify: Restart GeoNode
  tags: [geonode, config]

- name: Gera .env do GeoNode
  template:
    src: geonode.env.j2
    dest: /opt/geonode/.env
    mode: '0600'
  notify: Restart GeoNode
  tags: [geonode, config]

# ------------------------------------------------------------------
# nginx-internal.conf — server block extra para o IP interno do GeoNode.
# Permite que o GeoServer chame /o/token/ e /api/o/v4/tokeninfo/
# diretamente pela rede privada, evitando hairpin NAT do OpenStack.
# ------------------------------------------------------------------
- name: Gera nginx-internal.conf para aceitar IP interno
  template:
    src: nginx-internal.conf.j2
    dest: /opt/geonode/nginx-internal.conf
    mode: '0644'
  notify: Restart GeoNode
  tags: [geonode, config, oauth2]

# ------------------------------------------------------------------
# geonode.conf.envsubst — substitui o arquivo equivalente da imagem
# geonode/nginx. O docker-entrypoint.sh da imagem recalcula a
# variável $HTTP_SCHEME sempre a partir de HTTPS_HOST (http se vazio,
# https se preenchido) — não há como fixá-la via env var. Como TLS
# termina no HAProxy (não no Nginx do GeoNode), precisamos que o
# Nginx fale HTTP puro com o Django mas ainda assim reporte
# X-Forwarded-Proto: https. Por isso este arquivo é idêntico ao
# original, exceto que usa $PUBLIC_SCHEME (controlada por nós via
# Ansible) no lugar de $HTTP_SCHEME.
# ------------------------------------------------------------------
- name: Copia geonode.conf.envsubst customizado (X-Forwarded-Proto correto)
  copy:
    src: geonode.conf.envsubst
    dest: /opt/geonode/geonode.conf.envsubst
    mode: '0644'
  notify: Restart GeoNode
  tags: [geonode, config]

- name: Cria serviço systemd GeoNode
  template:
    src: geonode.service.j2
    dest: /etc/systemd/system/geonode.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart GeoNode
  tags: [geonode]

- name: Habilita e inicia GeoNode
  systemd:
    name: geonode
    enabled: yes
    state: started
    daemon_reload: yes
  tags: [geonode]

# O Nginx da imagem geonode/nginx bloqueia requests com Host: localhost
# retornando 444. Usa-se 127.0.0.1 que está sempre no server_name.
- name: Aguarda GeoNode responder (até 10 minutos)
  uri:
    url: "http://127.0.0.1/api/v2/resources/"
    status_code: [200, 401, 403]
    timeout: 10
  register: gn_health
  until: gn_health.status in [200, 401, 403]
  retries: 60
  delay: 10
  tags: [geonode]

- name: Executa migrações Django
  community.docker.docker_container_exec:
    container: geonode_django
    command: python manage.py migrate --noinput
  register: migrate_result
  changed_when: "'No migrations to apply' not in migrate_result.stdout"
  tags: [geonode, migrate]

# ------------------------------------------------------------------
# Garante as tabelas do django-dynamic-models nos dois bancos PostgreSQL.
#
# Contexto: o app django-dynamic-models registra suas migrations
# normalmente, mas em alguns cenários de deploy o syncdb não cria
# as tabelas físicas. Sem elas o Celery lança ProgrammingError ao
# processar qualquer upload de camada vetorial.
#
# O GeoNode usa dois bancos:
#   - geonode       → banco principal (Django ORM padrão)
#   - geonode_data  → banco de dados geoespaciais (roteador "datastore")
#
# O dynamic_models pode ser roteado para qualquer um dependendo do
# contexto de execução do Celery, por isso criamos em ambos.
#
# As tabelas são criadas com IF NOT EXISTS (idempotente).
# As permissões são concedidas ao usuário da aplicação (postgres_user).
# ------------------------------------------------------------------
- name: Garante tabelas dynamic_models no banco principal (geonode)
  community.docker.docker_container_exec:
    container: geonode_django
    command: >-
      python manage.py shell -c
      "from django.db import connections;
      conn = connections['default'];
      cursor = conn.cursor();
      cursor.execute('''
        CREATE TABLE IF NOT EXISTS public.dynamic_models_modelschema (
          id            serial PRIMARY KEY,
          name          varchar(100) NOT NULL UNIQUE,
          db_name       varchar(100) NOT NULL DEFAULT $$default$$,
          db_table_name varchar(100),
          managed       boolean NOT NULL DEFAULT true
        )
      ''');
      cursor.execute('''
        CREATE TABLE IF NOT EXISTS public.dynamic_models_fieldschema (
          id              serial PRIMARY KEY,
          name            varchar(100) NOT NULL,
          class_name      varchar(255) NOT NULL,
          model_schema_id integer NOT NULL
            REFERENCES public.dynamic_models_modelschema(id) ON DELETE CASCADE,
          kwargs          jsonb NOT NULL DEFAULT $${}$$,
          UNIQUE (name, model_schema_id)
        )
      ''');
      cursor.execute('GRANT ALL ON TABLE public.dynamic_models_modelschema TO {{ postgres_user }}');
      cursor.execute('GRANT ALL ON TABLE public.dynamic_models_fieldschema TO {{ postgres_user }}');
      cursor.execute('GRANT USAGE, SELECT ON SEQUENCE dynamic_models_modelschema_id_seq TO {{ postgres_user }}');
      cursor.execute('GRANT USAGE, SELECT ON SEQUENCE dynamic_models_fieldschema_id_seq TO {{ postgres_user }}');
      conn.connection.commit();
      print('dynamic_models OK — banco geonode')"
  changed_when: false
  tags: [geonode, migrate]

- name: Garante tabelas dynamic_models no banco geodata (geonode_data)
  community.docker.docker_container_exec:
    container: geonode_django
    command: >-
      python manage.py shell -c
      "from django.db import connections;
      conn = connections['datastore'];
      cursor = conn.cursor();
      cursor.execute('''
        CREATE TABLE IF NOT EXISTS public.dynamic_models_modelschema (
          id            serial PRIMARY KEY,
          name          varchar(100) NOT NULL UNIQUE,
          db_name       varchar(100) NOT NULL DEFAULT $$default$$,
          db_table_name varchar(100),
          managed       boolean NOT NULL DEFAULT true
        )
      ''');
      cursor.execute('''
        CREATE TABLE IF NOT EXISTS public.dynamic_models_fieldschema (
          id              serial PRIMARY KEY,
          name            varchar(100) NOT NULL,
          class_name      varchar(255) NOT NULL,
          model_schema_id integer NOT NULL
            REFERENCES public.dynamic_models_modelschema(id) ON DELETE CASCADE,
          kwargs          jsonb NOT NULL DEFAULT $${}$$,
          UNIQUE (name, model_schema_id)
        )
      ''');
      cursor.execute('GRANT ALL ON TABLE public.dynamic_models_modelschema TO {{ postgres_user }}');
      cursor.execute('GRANT ALL ON TABLE public.dynamic_models_fieldschema TO {{ postgres_user }}');
      cursor.execute('GRANT USAGE, SELECT ON SEQUENCE dynamic_models_modelschema_id_seq TO {{ postgres_user }}');
      cursor.execute('GRANT USAGE, SELECT ON SEQUENCE dynamic_models_fieldschema_id_seq TO {{ postgres_user }}');
      conn.connection.commit();
      print('dynamic_models OK — banco geonode_data')"
  changed_when: false
  tags: [geonode, migrate]

- name: Cria ou atualiza superusuário GeoNode
  # Usa get_or_create + set_password para garantir que a senha é
  # sempre sincronizada com envs/.env, mesmo em re-deploys.
  # Comando em linha única para evitar IndentationError no Python -c.
  community.docker.docker_container_exec:
    container: geonode_django
    command: "python manage.py shell -c \"from django.contrib.auth import get_user_model; User = get_user_model(); u, created = User.objects.get_or_create(username='{{ geonode_admin_user }}'); u.set_password('{{ geonode_admin_password }}'); u.email = '{{ geonode_admin_email }}'; u.is_superuser = True; u.is_staff = True; u.save(); print('created' if created else 'updated')\""
  register: admin_user_result
  changed_when: "'created' in admin_user_result.stdout"
  tags: [geonode, users]

- name: Coleta arquivos estáticos
  community.docker.docker_container_exec:
    container: geonode_django
    command: python manage.py collectstatic --noinput
  changed_when: false
  tags: [geonode, static]

# ------------------------------------------------------------------
# Troca de senha do admin do GeoServer.
#
# O entrypoint da imagem geonode/geoserver não processa
# GEOSERVER_ADMIN_PASSWORD — a senha inicial é sempre a factory
# password ("geoserver"). Esta task troca via REST API usando o
# endpoint /rest/security/usergroup/users/admin do GeoServer 2.x.
#
# É idempotente: se a factory password já não é válida (senha já
# foi trocada), o PUT retorna 401 e a task é marcada not changed.
# ------------------------------------------------------------------
- name: Aguarda GeoServer responder antes de trocar senha (até 5 minutos)
  uri:
    url: "http://{{ ip_geoserver_write }}:{{ geoserver_port }}/geoserver/rest/about/version.json"
    status_code: [200, 401]
    timeout: 10
    user: admin
    password: "{{ geoserver_admin_password }}"
    force_basic_auth: yes
  register: gs_auth_check
  until: gs_auth_check.status in [200, 401]
  retries: 30
  delay: 10
  tags: [geonode, geoserver_password]

- name: Troca senha do admin do GeoServer (factory → configurada)
  uri:
    url: "http://{{ ip_geoserver_write }}:{{ geoserver_port }}/geoserver/rest/security/usergroup/service/default/user/admin"
    method: POST
    body_format: json
    body:
      org.geoserver.rest.security.xml.JaxbUser:
        userName: admin
        password: "{{ geoserver_admin_password }}"
        enabled: true
    status_code: [200, 201, 204, 401]
    user: admin
    password: "{{ geoserver_factory_password }}"
    force_basic_auth: yes
  register: gs_pw_change
  # 401 = factory password já não é válida (senha já foi trocada)
  # 405 = endpoint não suporta POST (usa PUT nessa versão)
  failed_when: gs_pw_change.status not in [200, 201, 204, 401]
  changed_when: gs_pw_change.status in [200, 201, 204]
  tags: [geonode, geoserver_password]


# ------------------------------------------------------------------
# invoke prepare configura OAuth2 e fixtures de integração com GeoServer.
# Roda após a troca de senha para garantir que usa a senha correta.
# Se oauth2_client_id estiver vazio, pula.
# ------------------------------------------------------------------
- name: Executa invoke prepare (configura OAuth2 e GeoServer)
  community.docker.docker_container_exec:
    container: geonode_django
    command: invoke prepare
    env:
      OAUTH2_CLIENT_ID: "{{ oauth2_client_id }}"
      OAUTH2_CLIENT_SECRET: "{{ oauth2_client_secret }}"
  changed_when: false
  when: oauth2_client_id | length > 0
  tags: [geonode, oauth2]

# ------------------------------------------------------------------
# O invoke prepare gera redirect_uris como {SITEURL}geoserver/index.html
# O GeoServer usa /geoserver/index.html como redirectUri no OAuth2.
# Garantimos que ambos os paths estejam registrados.
# ------------------------------------------------------------------
- name: Corrige redirect URIs da aplicação OAuth2
  community.docker.docker_container_exec:
    container: geonode_django
    command: >-
      python manage.py shell -c
      "from oauth2_provider.models import Application;
      app = Application.objects.filter(name='GeoServer').first();
      app and setattr(app, 'redirect_uris', '{{ public_scheme }}://{{ geonode_public_hostname }}/geoserver/web/\n{{ public_scheme }}://{{ geonode_public_hostname }}/geoserver/index.html') or None;
      app and app.save();
      print('redirect_uris:', app.redirect_uris if app else 'app not found')"
  changed_when: false
  when: oauth2_client_id | length > 0
  tags: [geonode, oauth2]
