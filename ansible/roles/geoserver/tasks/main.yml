---
# roles/geoserver/tasks/main.yml
# Deploya o GeoServer via Docker em cada nó (write ou read)
# A variável `geoserver_role` (write|read) e `geoserver_is_master` (bool)
# são definidas no inventário por host.

# ------------------------------------------------------------------
# Usuário e grupos
# ------------------------------------------------------------------
- name: Cria grupo geoserver
  group:
    name: geoserver
    state: present
  tags: [geoserver]

- name: Cria usuário geoserver
  user:
    name: geoserver
    group: geoserver
    groups: docker
    append: yes
    shell: /usr/sbin/nologin
    home: /opt/geoserver
    create_home: no
    system: yes
    state: present
  tags: [geoserver]

- name: Cria estrutura de diretórios GeoServer
  file:
    path: "{{ item }}"
    state: directory
    owner: geoserver
    group: geoserver
    mode: '0755'
  loop:
    - "{{ geoserver_data_dir }}"
    - "{{ geoserver_data_dir }}/logs"
    - "{{ geoserver_data_dir }}/gwc"
    - "{{ geoserver_data_dir }}/plugins"
    - "{{ geoserver_data_dir }}/security/filter/geonode-oauth2"
    - /opt/geoserver/config
  tags: [geoserver]

# ------------------------------------------------------------------
# GDAL native lib pré-compilada (Ubuntu 22.04 x86_64)
#
# libgdal-java não existe no Ubuntu 22.04. A lib foi compilada uma vez
# via SWIG a partir do fonte GDAL 3.4.1 e commitada em files/.
# O copy-plugins.sh copia de /opt/geoserver/gdal-native/ para
# native-jni-lib (java.library.path) antes de o Tomcat iniciar.
# ------------------------------------------------------------------
- name: Cria diretório para GDAL native lib
  file:
    path: /opt/geoserver/gdal-native
    state: directory
    owner: geoserver
    group: geoserver
    mode: '0755'
  tags: [geoserver, gdal]

- name: Copia libgdalalljni.so pré-compilada para o host
  copy:
    src: libgdalalljni.so
    dest: /opt/geoserver/gdal-native/libgdalalljni.so
    owner: geoserver
    group: geoserver
    mode: '0755'
  notify: Restart GeoServer
  tags: [geoserver, gdal]

# ------------------------------------------------------------------
# Pré-população do data dir (apenas no master — workers herdam via NFS)
# ------------------------------------------------------------------
- name: Pré-popula data dir com configuração padrão da imagem (primeira execução)
  shell: |
    docker run --rm \
      -v {{ geoserver_data_dir }}:/target \
      --entrypoint sh \
      {{ geoserver_image }} \
      -c "cp -rn /usr/local/tomcat/webapps/geoserver/data/. /target/"
    chown -R geoserver:geoserver {{ geoserver_data_dir }}
  args:
    creates: "{{ geoserver_data_dir }}/styles/default_point.sld"
  tags: [geoserver]

# ------------------------------------------------------------------
# Script corrigido do entrypoint da imagem geonode/geoserver.
#
# O set_geoserver_auth.sh original adiciona `echo " " >> file` antes
# de processar cada arquivo XML de segurança (config.xml do OAuth2,
# role service, auth provider e global.xml). Esse trailing whitespace
# causa java.io.EOFException no XStream ao carregar as configurações
# durante a autenticação OAuth2.
#
# Montamos uma versão corrigida (sem o echo) via volume no docker-compose,
# sobrescrevendo o script da imagem antes do container iniciar.
# ------------------------------------------------------------------
- name: Copia set_geoserver_auth.sh corrigido para o host
  copy:
    src: set_geoserver_auth.sh
    dest: /opt/geoserver/set_geoserver_auth.sh
    owner: root
    group: root
    mode: '0755'
  notify: Restart GeoServer
  tags: [geoserver, oauth2]

# ------------------------------------------------------------------
# Script wrapper de entrypoint — copia JARs dos plugins para WEB-INF/lib
#
# O classloader do Tomcat NÃO recursiona subdirectórios de WEB-INF/lib.
# Portanto os JARs precisam estar no diretório raiz de WEB-INF/lib,
# não em WEB-INF/lib/algum-subdir/. Como o container é read-only na camada
# de imagem, o copy precisa acontecer em runtime, antes do Tomcat iniciar.
# Este script é montado como entrypoint do container; ao final executa o
# CMD original da imagem (exec "$@").
# ------------------------------------------------------------------
- name: Copia copy-plugins.sh (entrypoint wrapper) para o host
  copy:
    src: copy-plugins.sh
    dest: /opt/geoserver/copy-plugins.sh
    owner: root
    group: root
    mode: '0755'
  notify: Restart GeoServer
  tags: [geoserver, plugins]

# ------------------------------------------------------------------
# Plugins (baixa apenas no master; workers herdam via NFS)
# ------------------------------------------------------------------
- name: Cria diretório de plugins
  file:
    path: /opt/geoserver/plugins
    state: directory
    owner: geoserver
    mode: '0755'
  when: geoserver_is_master | bool
  tags: [geoserver, plugins]

- name: Download e instalação dos plugins GeoServer
  include_tasks: plugins.yml
  when: geoserver_is_master | bool
  tags: [geoserver, plugins]

# ------------------------------------------------------------------
# Configuração OAuth2 — cria o config.xml do filtro geonode-oauth2
#
# ATENÇÃO: o campo <cliendId> (sem 't') é intencional — é o nome
# do campo Java na classe GeoNodeOAuthAuthenticationFilterConfig.
# O XStream deserializa pelo nome do campo, não pelo nome semântico.
# Corrigir para <clientId> faz o plugin retornar client_id=null.
#
# Só aplica no master e se oauth2_client_id estiver definido.
# ------------------------------------------------------------------
- name: Cria config.xml do filtro OAuth2 do GeoServer
  template:
    src: geonode-oauth2.config.xml.j2
    dest: "{{ geoserver_data_dir }}/security/filter/geonode-oauth2/config.xml"
    owner: geoserver
    group: geoserver
    mode: '0644'
  when:
    - geoserver_is_master | bool
    - oauth2_client_id | length > 0
  notify: Restart GeoServer
  tags: [geoserver, oauth2]

# ------------------------------------------------------------------
# Configuração do security/config.xml — filter chain OAuth2.
#
# O pré-populate copia o security/config.xml padrão da imagem, que
# não tem o filtro geonode-oauth2 na webLogin chain. Este script
# Python ajusta o arquivo para:
#   1. Adicionar geonode-oauth2 na chain webLogin
#   2. Habilitar allowSessionCreation na webLogin (necessário para
#      o OAuth2 armazenar o state entre redirect e callback)
#   3. Adicionar geonode-oauth2 na chain webLogout
#
# O loginEndpoint no config.xml do filtro é /j_spring_oauth2_geonode_login.
# O Wicket gera o form action como /geoserver/web/j_spring_oauth2_geonode_login
# (relativo à página). O HAProxy reescreve esse path para
# /geoserver/j_spring_oauth2_geonode_login antes de encaminhar ao GeoServer,
# que é o path que o Spring Security realmente escuta.
# ------------------------------------------------------------------

# O security/config.xml NÃO existe no data dir embutido na imagem
# geonode/geoserver — ele é gerado pelo GeoServer na primeira inicialização.
# O pré-populate via `cp -rn` não o produz.
#
# PROBLEMA CONHECIDO: a tarefa de extração usa redirecionamento shell (`>`).
# Se o arquivo não existir na imagem, o `docker run` retorna código de saída
# não-zero mas o shell já criou o arquivo de destino com 0 bytes antes de
# receber o erro. Um XML vazio causa XStreamException/EOFException no
# GeoServerSecurityManager, que o Spring propaga como
# BeanCurrentlyInCreationException ("circular reference") — erro enganoso.
#
# Solução:
#   1. Remover o arquivo se estiver vazio.
#   2. Tentar extrair da imagem apenas se o arquivo não existir; usar
#      variável de shell para evitar criar arquivo vazio em caso de falha.
#   3. Executar configure_security_xml.py somente se o arquivo existir
#      e tiver conteúdo (se não existir, o GeoServer o gera no 1.º boot;
#      o script será executado no próximo run do playbook).
- name: Verifica se security/config.xml existe (gerado pelo pré-populate)
  stat:
    path: "{{ geoserver_data_dir }}/security/config.xml"
  register: security_config_xml_stat
  when: geoserver_is_master | bool
  tags: [geoserver, oauth2]

- name: Remove security/config.xml vazio (docker run falhou — arquivo não existe na imagem)
  # Um arquivo vazio causa XStreamException no GeoServerSecurityManager,
  # que o Spring propaga como BeanCurrentlyInCreationException.
  # Ao remover, o GeoServer gera o arquivo correto na primeira inicialização.
  file:
    path: "{{ geoserver_data_dir }}/security/config.xml"
    state: absent
  when:
    - geoserver_is_master | bool
    - security_config_xml_stat.stat.exists | default(false)
    - security_config_xml_stat.stat.size | default(1) == 0
  tags: [geoserver, oauth2]

- name: Extrai security/config.xml da imagem (ausente após pré-populate)
  # Usa variável de shell para capturar o conteúdo antes de escrever no disco.
  # Se o arquivo não existir na imagem (conteúdo vazio), não cria arquivo vazio.
  shell: |
    CONTENT=$(docker run --rm --entrypoint sh {{ geoserver_image }} \
      -c 'cat /usr/local/tomcat/webapps/geoserver/data/security/config.xml 2>/dev/null' \
      2>/dev/null || true)
    if [ -n "$CONTENT" ]; then
      printf '%s\n' "$CONTENT" > "{{ geoserver_data_dir }}/security/config.xml"
      chown geoserver:geoserver "{{ geoserver_data_dir }}/security/config.xml"
    fi
    # Se CONTENT estiver vazio: arquivo não existe na imagem.
    # O GeoServer irá gerá-lo na primeira inicialização — não cria arquivo vazio.
  when:
    - geoserver_is_master | bool
    - not (security_config_xml_stat.stat.exists | default(false))
      or (security_config_xml_stat.stat.size | default(1) == 0)
  tags: [geoserver, oauth2]

- name: Re-verifica security/config.xml após tentativa de extração
  stat:
    path: "{{ geoserver_data_dir }}/security/config.xml"
  register: security_config_xml_stat_post
  when: geoserver_is_master | bool
  tags: [geoserver, oauth2]

- name: Configura security/config.xml para OAuth2 (webLogin chain)
  # Executa somente se o arquivo existir e tiver conteúdo.
  # Se ainda não existir (arquivo não está na imagem), o GeoServer o gera
  # no primeiro boot; este script será aplicado no próximo run do playbook.
  script: configure_security_xml.py {{ geoserver_data_dir }}/security/config.xml
  args:
    executable: python3
  when:
    - geoserver_is_master | bool
    - security_config_xml_stat_post.stat.exists | default(false)
    - security_config_xml_stat_post.stat.size | default(0) > 0
  register: security_xml_result
  changed_when: "'changed' in security_xml_result.stdout"
  notify: Restart GeoServer
  tags: [geoserver, oauth2]

# ------------------------------------------------------------------
# Restaura o geonode REST role service/config.xml da imagem.
# O pré-populate via `cp -rn` falha silenciosamente em diretórios
# com espaço no nome, deixando o arquivo vazio. O XStream do GeoServer
# lança EOFException ao tentar carregar um arquivo vazio.
# ------------------------------------------------------------------
- name: Garante que o diretório 'geonode REST role service' existe
  file:
    path: "{{ geoserver_data_dir }}/security/role/geonode REST role service"
    state: directory
    owner: geoserver
    group: geoserver
    mode: '0755'
  when: geoserver_is_master | bool
  tags: [geoserver, oauth2]

- name: Verifica estado do geonode REST role service/config.xml
  stat:
    path: "{{ geoserver_data_dir }}/security/role/geonode REST role service/config.xml"
  register: role_service_config_stat
  when: geoserver_is_master | bool
  tags: [geoserver, oauth2]

- name: Restaura geonode REST role service/config.xml da imagem
  # Roda se o arquivo não existe ou está vazio (cp -rn falha silenciosamente
  # em diretórios com espaço no nome, deixando o arquivo vazio).
  # Um arquivo vazio causa EOFException no XStream do GeoServer.
  shell: |
    docker run --rm --entrypoint sh {{ geoserver_image }} \
      -c 'cat "/usr/local/tomcat/webapps/geoserver/data/security/role/geonode REST role service/config.xml"' \
      > "{{ geoserver_data_dir }}/security/role/geonode REST role service/config.xml"
    chown geoserver:geoserver "{{ geoserver_data_dir }}/security/role/geonode REST role service/config.xml"
  register: role_service_restore
  changed_when: true
  when:
    - geoserver_is_master | bool
    - not role_service_config_stat.stat.exists or role_service_config_stat.stat.size == 0
  notify: Restart GeoServer
  tags: [geoserver, oauth2]

# ------------------------------------------------------------------
# Corrige o proxyBaseUrl no global.xml para usar o hostname público.
# Sem isso, o Spring Security monta o form action com o IP interno
# do VIP e a CSP (form-action 'self') bloqueia o login OAuth2.
# Usa replace (regex) para evitar dependência de lxml no host remoto.
# ------------------------------------------------------------------
- name: Verifica se global.xml existe (gerado pelo pré-populate)
  stat:
    path: "{{ geoserver_data_dir }}/global.xml"
  register: global_xml_stat
  when: geoserver_is_master | bool
  tags: [geoserver, oauth2]

- name: Remove global.xml vazio (mesmo problema do security/config.xml — não existe na imagem)
  file:
    path: "{{ geoserver_data_dir }}/global.xml"
    state: absent
  when:
    - geoserver_is_master | bool
    - global_xml_stat.stat.exists | default(false)
    - global_xml_stat.stat.size | default(1) == 0
  tags: [geoserver, oauth2]

- name: Extrai global.xml da imagem (ausente após pré-populate)
  shell: |
    CONTENT=$(docker run --rm --entrypoint sh {{ geoserver_image }} \
      -c 'cat /usr/local/tomcat/webapps/geoserver/data/global.xml 2>/dev/null' \
      2>/dev/null || true)
    if [ -n "$CONTENT" ]; then
      printf '%s\n' "$CONTENT" > "{{ geoserver_data_dir }}/global.xml"
      chown geoserver:geoserver "{{ geoserver_data_dir }}/global.xml"
    fi
    # Se vazio: não existe na imagem; GeoServer o gera na primeira inicialização.
  when:
    - geoserver_is_master | bool
    - not (global_xml_stat.stat.exists | default(false))
      or (global_xml_stat.stat.size | default(1) == 0)
  tags: [geoserver, oauth2]

- name: Re-verifica global.xml após tentativa de extração
  stat:
    path: "{{ geoserver_data_dir }}/global.xml"
  register: global_xml_stat_post
  when: geoserver_is_master | bool
  tags: [geoserver, oauth2]

- name: Corrige proxyBaseUrl no global.xml do GeoServer
  replace:
    path: "{{ geoserver_data_dir }}/global.xml"
    regexp: '<proxyBaseUrl>.*</proxyBaseUrl>'
    replace: '<proxyBaseUrl>http://{{ geonode_public_hostname }}/geoserver</proxyBaseUrl>'
  when:
    - geoserver_is_master | bool
    - global_xml_stat_post.stat.exists | default(false)
    - global_xml_stat_post.stat.size | default(0) > 0
  notify: Restart GeoServer
  tags: [geoserver, oauth2]

# ------------------------------------------------------------------
# Configuração de clustering JMS
# ------------------------------------------------------------------
# cluster.properties é escrito em /opt/geoserver/cluster.properties (caminho LOCAL
# do host, fora do NFS). O docker-compose monta esse arquivo sobre
# /opt/geoserver/data_dir/cluster.properties dentro do container, sobrepondo
# o arquivo do data_dir compartilhado. Sem isso, o Ansible do worker escreve
# no data_dir (montado via NFS do master) e sobrescreve a config do master.
- name: Cria arquivo cluster.properties (caminho local — fora do NFS)
  template:
    src: cluster.properties.j2
    dest: /opt/geoserver/cluster.properties
    owner: geoserver
    group: geoserver
    mode: '0644'
  notify: Restart GeoServer
  tags: [geoserver, config]

# ------------------------------------------------------------------
# Docker Compose
# ------------------------------------------------------------------
- name: Gera docker-compose.yml do GeoServer
  template:
    src: docker-compose.geoserver.yml.j2
    dest: /opt/geoserver/docker-compose.yml
    owner: geoserver
    group: geoserver
    mode: '0644'
  notify: Restart GeoServer
  tags: [geoserver, config]

- name: Gera .env do GeoServer
  template:
    src: geoserver.env.j2
    dest: /opt/geoserver/.env
    owner: geoserver
    group: geoserver
    mode: '0600'
  notify: Restart GeoServer
  tags: [geoserver, config]

- name: Cria serviço systemd para GeoServer
  template:
    src: geoserver.service.j2
    dest: /etc/systemd/system/geoserver.service
    mode: '0644'
  notify:
    - Reload systemd
    - Restart GeoServer
  tags: [geoserver]

- name: Habilita e inicia serviço GeoServer
  systemd:
    name: geoserver
    enabled: yes
    state: started
    daemon_reload: yes
  tags: [geoserver]

# ------------------------------------------------------------------
# Healthcheck (aguarda GeoServer subir antes de continuar)
# ------------------------------------------------------------------
- name: Aguarda GeoServer responder (até 5 minutos)
  uri:
    url: "http://localhost:{{ geoserver_port }}/geoserver/web/"
    status_code: [200, 302]
    timeout: 10
  register: gs_health
  until: gs_health.status in [200, 302]
  retries: 30
  delay: 10
  when: geoserver_is_master | bool
  tags: [geoserver]
