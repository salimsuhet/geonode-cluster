---
# roles/keepalived/tasks/main.yml
# Configura VRRP entre haproxy-1 (MASTER) e haproxy-2 (BACKUP)

- name: Instala Keepalived
  apt:
    name: keepalived
    state: present
  tags: [keepalived]

# ------------------------------------------------------------------
# Detecta a interface de rede correta para o VIP.
#
# Estratégia: procura a interface que já tem o IP do próprio host
# (ansible_host) atribuído. Isso é 100% confiável em qualquer
# ambiente (Vagrant eth1, OpenStack ens3, AWS enp0s8, etc.) sem
# depender de nomes ou ordem de interfaces.
# ------------------------------------------------------------------
- name: Detecta interface que carrega o IP do host
  set_fact:
    keepalived_interface: >-
      {{ ansible_interfaces
         | map('regex_replace', '^(.*)$', 'ansible_\1')
         | map('extract', hostvars[inventory_hostname])
         | selectattr('ipv4', 'defined')
         | selectattr('ipv4.address', 'equalto', ansible_host)
         | map(attribute='device')
         | first
         | default(keepalived_interface) }}
  tags: [keepalived]

- name: Exibe interface selecionada para o Keepalived
  debug:
    msg: "Interface Keepalived: {{ keepalived_interface }}"
  tags: [keepalived]

- name: Gera configuração Keepalived
  template:
    src: keepalived.conf.j2
    dest: /etc/keepalived/keepalived.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart Keepalived
  tags: [keepalived, config]

- name: Cria script de healthcheck HAProxy
  copy:
    dest: /etc/keepalived/check_haproxy.sh
    content: |
      #!/bin/bash
      if systemctl is-active --quiet haproxy; then
        exit 0
      fi
      systemctl start haproxy
      sleep 2
      systemctl is-active --quiet haproxy
      exit $?
    mode: '0755'
  tags: [keepalived]

- name: Habilita e inicia Keepalived
  systemd:
    name: keepalived
    enabled: yes
    state: started
  tags: [keepalived]

- name: Verifica VIP no nó MASTER
  command: "ip addr show {{ keepalived_interface }}"
  register: vip_check
  changed_when: false
  when: keepalived_state == 'MASTER'
  tags: [keepalived]

- name: Exibe status do VIP
  debug:
    msg: >-
      VIP {{ haproxy_vip }}
      {{ 'ATIVO neste nó' if haproxy_vip in vip_check.stdout else 'não atribuído (normal em BACKUP)' }}
  when: keepalived_state == 'MASTER'
  tags: [keepalived]
